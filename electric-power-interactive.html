<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电功率交互式训练程序（30题）</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 20px;
  line-height: 1.6;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  padding: 30px;
}

header {
  text-align: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 3px solid #667eea;
}

h1 {
  font-size: 28px;
  color: #333;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 14px;
  color: #666;
}

.progress-bar {
  width: 100%;
  height: 25px;
  background: #e0e0e0;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 20px;
  position: relative;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #667eea, #764ba2);
  width: 0%;
  transition: width 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 12px;
  font-weight: bold;
}

.question-card {
  background: #f9f9f9;
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 20px;
  border-left: 5px solid #667eea;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.question-number {
  font-size: 16px;
  font-weight: bold;
  color: #667eea;
}

.question-type {
  font-size: 12px;
  padding: 4px 12px;
  background: #667eea;
  color: white;
  border-radius: 12px;
}

.question-stem {
  font-size: 16px;
  color: #333;
  margin-bottom: 20px;
  line-height: 1.8;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option {
  padding: 15px 20px;
  background: white;
  border: 2px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 15px;
}

.option:hover {
  border-color: #667eea;
  background: #f0f4ff;
}

.option.selected {
  border-color: #667eea;
  background: #667eea;
  color: white;
}

.option.correct {
  border-color: #4caf50;
  background: #4caf50;
  color: white;
}

.option.wrong {
  border-color: #f44336;
  background: #f44336;
  color: white;
}

.cloze-container {
  background: white;
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 15px;
}

.cloze-text {
  font-size: 16px;
  line-height: 2;
  color: #333;
}

.blank {
  display: inline-block;
  min-width: 120px;
  padding: 8px 15px;
  border: 2px dashed #667eea;
  border-radius: 6px;
  background: #f0f4ff;
  text-align: center;
  margin: 0 5px;
  min-height: 40px;
  vertical-align: middle;
}

.blank.filled {
  background: #667eea;
  color: white;
  border-style: solid;
}

.blank.correct-fill {
  background: #4caf50;
  color: white;
  border-color: #4caf50;
}

.blank.wrong-fill {
  background: #f44336;
  color: white;
  border-color: #f44336;
}

.word-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
  padding: 15px;
  background: #f9f9f9;
  border-radius: 8px;
}

.word {
  padding: 10px 20px;
  background: white;
  border: 2px solid #667eea;
  border-radius: 8px;
  cursor: grab;
  font-size: 14px;
  color: #333;
  transition: all 0.3s ease;
}

.word:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.word.dragging {
  opacity: 0.5;
  cursor: grabbing;
}

.word.used {
  opacity: 0.3;
  cursor: not-allowed;
}

.feedback {
  margin-top: 15px;
  padding: 15px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.6;
  display: none;
}

.feedback.show {
  display: block;
}

.feedback.correct {
  background: #e8f5e9;
  color: #2e7d32;
  border-left: 4px solid #4caf50;
}

.feedback.wrong {
  background: #ffebee;
  color: #c62828;
  border-left: 4px solid #f44336;
}

.teacher-view {
  margin-top: 10px;
  padding: 12px;
  background: #fff3e0;
  border-radius: 8px;
  border-left: 4px solid #ff9800;
}

.teacher-toggle {
  cursor: pointer;
  color: #f57c00;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
  user-select: none;
}

.teacher-content {
  font-size: 13px;
  color: #666;
  display: none;
  line-height: 1.8;
}

.teacher-content.show {
  display: block;
}

.teacher-content div {
  margin: 5px 0;
}

.btn-submit {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 10px;
}

.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.btn-submit:disabled {
  background: #ccc;
  cursor: not-allowed;
  transform: none;
}

.navigation {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.btn-nav {
  flex: 1;
  padding: 12px;
  background: white;
  border: 2px solid #667eea;
  color: #667eea;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-nav:hover:not(:disabled) {
  background: #667eea;
  color: white;
}

.btn-nav:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.score-board {
  text-align: center;
  padding: 30px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-radius: 12px;
  margin-top: 20px;
}

.score-board h2 {
  font-size: 24px;
  margin-bottom: 15px;
}

.score-number {
  font-size: 48px;
  font-weight: bold;
  margin: 20px 0;
}

.score-details {
  font-size: 16px;
  margin-top: 15px;
  line-height: 2;
}

.btn-restart {
  margin-top: 20px;
  padding: 12px 30px;
  background: white;
  color: #667eea;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-restart:hover {
  transform: scale(1.05);
}

@media (max-width: 600px) {
  .container {
    padding: 20px;
  }

  h1 {
    font-size: 22px;
  }

  .question-stem {
    font-size: 15px;
  }

  .option {
    padding: 12px 15px;
    font-size: 14px;
  }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ 电功率交互式训练程序</h1>
    <p class="subtitle">30道题 | 选择题 + 拖拽填空 | 适合基础水平一般的学生</p>
  </header>

  <div class="progress-bar">
    <div class="progress-fill" id="progressBar">0/30</div>
  </div>

  <div id="questionContainer"></div>

  <div class="navigation">
    <button class="btn-nav" id="btnPrev" onclick="prevQuestion()">← 上一题</button>
    <button class="btn-nav" id="btnNext" onclick="nextQuestion()">下一题 →</button>
  </div>

  <div id="scoreBoard" style="display:none;"></div>
</div>

<script>

    options: ["P = W × t", "P = W / t", "P = W + t", "P = t / W"],

    options: ["W = Pt", "W = P / t", "W = UI", "W = I²Rt"],

    options: ["电热水壶的额定功率", "电热水壶的额定电压", "电热水壶的实际电压", "电热水壶消耗的电能"],
    correctIndex: 1,

  {
    type: "choice",

let currentQuestion = 0;
let userAnswers = Array(quizData.length).fill(null);
let correctCount = 0;

function renderQuestion() {
  const q = quizData[currentQuestion];
  const container = document.getElementById('questionContainer');

  let html = `
    <div class="question-card">
      <div class="question-header">
        <span class="question-number">第 ${currentQuestion + 1} 题 / 共 ${quizData.length} 题</span>
        <span class="question-type">${q.type === 'choice' ? '选择题' : '拖拽填空题'}</span>
      </div>
      <div class="question-stem">${q.stem}</div>
  `;

  if (q.type === 'choice') {
    html += '<div class="options">';
    q.options.forEach((option, index) => {
      const selected = userAnswers[currentQuestion] === index ? 'selected' : '';
      const disabled = userAnswers[currentQuestion] !== null ? 'onclick=""' : `onclick="selectChoice(${index})"`;
      let className = 'option ' + selected;

      if (userAnswers[currentQuestion] !== null) {
        if (index === q.correctIndex) {
          className = 'option correct';
        } else if (index === userAnswers[currentQuestion]) {
          className = 'option wrong';
        }
      }

      html += `<div class="${className}" ${disabled}>${option}</div>`;
    });
    html += '</div>';

    if (userAnswers[currentQuestion] !== null) {
      const isCorrect = userAnswers[currentQuestion] === q.correctIndex;
      html += `
        <div class="feedback ${isCorrect ? 'correct' : 'wrong'} show">
          <strong>${isCorrect ? '✓ 回答正确！' : '✗ 回答错误'}</strong><br>
          ${q.explanation}
        </div>
      `;
    }

  } else if (q.type === 'cloze') {
    const blankContent = userAnswers[currentQuestion] || '';
    let blankClass = 'blank';

    if (userAnswers[currentQuestion] !== null) {
      blankClass += userAnswers[currentQuestion] === q.correctOption ? ' correct-fill' : ' wrong-fill';
    } else if (blankContent) {
      blankClass += ' filled';
    }

    const stemWithBlank = q.stem.replace(/_{4,}/g, `<span class="${blankClass}" id="dropZone" ondrop="drop(event)" ondragover="allowDrop(event)">${blankContent}</span>`);

    html += `
      <div class="cloze-container">
        <div class="cloze-text">${stemWithBlank}</div>
      </div>
      <div class="word-bank">
    `;

    q.options.forEach((word, index) => {
      const used = userAnswers[currentQuestion] === word ? 'used' : '';
      const disabled = userAnswers[currentQuestion] !== null ? '' : `draggable="true" ondragstart="drag(event, '${word}')"`;
      html += `<div class="word ${used}" ${disabled}>${word}</div>`;
    });

    html += '</div>';

    if (userAnswers[currentQuestion] === null && blankContent === '') {
      html += '<button class="btn-submit" onclick="submitCloze()">提交答案</button>';
    }

    if (userAnswers[currentQuestion] !== null) {
      const isCorrect = userAnswers[currentQuestion] === q.correctOption;
      html += `
        <div class="feedback ${isCorrect ? 'correct' : 'wrong'} show">
          <strong>${isCorrect ? '✓ 回答正确！' : '✗ 回答错误'}</strong><br>
          正确答案：${q.correctOption}<br>
          ${q.explanation}
        </div>
      `;
    }
  }

  html += `
    <div class="teacher-view">
      <div class="teacher-toggle" onclick="toggleTeacher()">👨‍🏫 教师视角（点击展开）</div>
      <div class="teacher-content" id="teacherContent">
        <div><strong>知识点：</strong>${q.knowledgePoint}</div>
        <div><strong>易错点：</strong>${q.pitfalls}</div>
      </div>
    </div>
  </div>
  `;

  container.innerHTML = html;
  updateProgress();
  updateNavButtons();
}

function selectChoice(index) {
  if (userAnswers[currentQuestion] !== null) return;

  userAnswers[currentQuestion] = index;
  if (index === quizData[currentQuestion].correctIndex) {
    correctCount++;
  }
  renderQuestion();
}

let draggedWord = '';

function drag(event, word) {
  draggedWord = word;
  event.target.classList.add('dragging');
}

function allowDrop(event) {
  event.preventDefault();
}

function drop(event) {
  event.preventDefault();
  if (userAnswers[currentQuestion] !== null) return;

  const dropZone = document.getElementById('dropZone');
  dropZone.textContent = draggedWord;
  dropZone.classList.add('filled');

  document.querySelectorAll('.word').forEach(w => {
    w.classList.remove('dragging');
    if (w.textContent === draggedWord) {
      w.classList.add('used');
    }
  });
}

function submitCloze() {
  const dropZone = document.getElementById('dropZone');
  const answer = dropZone.textContent.trim();

  if (!answer) {
    alert('请先拖拽一个选项到空格中！');
    return;
  }

  userAnswers[currentQuestion] = answer;
  if (answer === quizData[currentQuestion].correctOption) {
    correctCount++;
  }
  renderQuestion();
}

function toggleTeacher() {
  const content = document.getElementById('teacherContent');
  content.classList.toggle('show');
}

function updateProgress() {
  const answered = userAnswers.filter(a => a !== null).length;
  const percentage = (answered / quizData.length) * 100;
  const progressBar = document.getElementById('progressBar');
  progressBar.style.width = percentage + '%';
  progressBar.textContent = `${answered}/${quizData.length}`;
}

function updateNavButtons() {
  document.getElementById('btnPrev').disabled = currentQuestion === 0;
  document.getElementById('btnNext').disabled = currentQuestion === quizData.length - 1;

  if (currentQuestion === quizData.length - 1 && userAnswers.every(a => a !== null)) {
    showScoreBoard();
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

function nextQuestion() {
  if (currentQuestion < quizData.length - 1) {
    currentQuestion++;
    renderQuestion();
  }
}

function showScoreBoard() {
  const percentage = Math.round((correctCount / quizData.length) * 100);
  const scoreBoard = document.getElementById('scoreBoard');

  let level = '';
  if (percentage >= 90) level = '优秀！';
  else if (percentage >= 75) level = '良好！';
  else if (percentage >= 60) level = '及格';
  else level = '需要加强';

  scoreBoard.innerHTML = `
    <div class="score-board">
      <h2>🎉 训练完成！</h2>
      <div class="score-number">${correctCount} / ${quizData.length}</div>
      <div class="score-details">
        正确率：${percentage}%<br>
        评价：${level}<br>
        <br>
        建议：${percentage < 75 ? '请重点复习错题，巩固基础知识点' : '继续保持，可以尝试更多综合题！'}
      </div>
      <button class="btn-restart" onclick="restart()">重新训练</button>
    </div>
  `;

  scoreBoard.style.display = 'block';
}

function restart() {
  currentQuestion = 0;
  userAnswers = Array(quizData.length).fill(null);
  correctCount = 0;
  document.getElementById('scoreBoard').style.display = 'none';
  renderQuestion();
}

// 初始化
renderQuestion();
</script>
